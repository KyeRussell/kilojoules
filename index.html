<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kilojoules</title>
  <meta name="description" content="Put the kilojoules from your workout into perspective.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffe4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221626" media="(prefers-color-scheme: dark)">

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kilojoules">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Kilojoules<svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg></h1>
    </header>

    <section class="card card--yellow">
      <div class="section-head">
        <label class="field-label" for="kj">Kilojoules burned</label>
        <button type="button" id="clear" class="text-button" hidden>Clear</button>
      </div>
      <div class="kj-field">
        <input id="kj" type="text" inputmode="decimal" placeholder="0"
               autocomplete="off" enterkeyhint="done" aria-describedby="kj-unit">
        <span id="kj-unit" class="unit">kJ</span>
      </div>
    </section>

    <section id="results" class="card" hidden>
      <div class="section-head">
        <h2>That's about…</h2>
        <button type="button" id="edit-toggle" class="text-button" aria-pressed="false">Edit</button>
      </div>
      <ul id="comparisons" class="comparisons" aria-live="polite"></ul>
      <p id="empty" class="empty" hidden>
        Nothing to compare against yet. Add something below.
      </p>
      <form id="add-form" class="add-form" autocomplete="off">
        <h2>Add a comparison</h2>
        <label>
          <span>Name</span>
          <input name="name" type="text" placeholder="Big Mac" required
                 autocapitalize="words" enterkeyhint="next">
        </label>
        <label>
          <span>Kilojoules each</span>
          <input name="kj" type="text" inputmode="decimal" placeholder="2200" required
                 enterkeyhint="done">
        </label>
        <button type="submit" class="primary-button">Save</button>
      </form>
    </section>

    <footer class="foot">
      <p>Everything you enter is stored on-device. Nothing is sent to a server.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
